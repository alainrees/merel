name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  # The runner's disk is small: no incremental files and no debug info keep the test
  # binaries within it.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  # The Signal helper is its own workspace (AGPL, see apps/merel-signal/Cargo.toml).
  signal:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/merel-signal
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The Signal libraries compile their protocol buffers at build time.
      # RingRTC (calls) plays sound through PulseAudio on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpulse-dev
      - if: runner.os == 'macOS'
        # coreutils: RingRTC's build scripts use grealpath.
        run: brew install protobuf coreutils
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/merel-signal
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo build --locked
      # With calls: RingRTC on the WebRTC Signal builds for its desktop app.
      - run: cargo clippy --locked --all-targets --features calls-prebuilt -- -D warnings
      - run: cargo test --locked --features calls-prebuilt

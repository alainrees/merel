name: Mobile
# Builds Merel's core (crates/mobile) for the iPhone and Android with the Swift and Kotlin
# bindings the apps call it through, the iPhone app (apps/ios) for the simulator and the
# Android app (apps/android) as a debug APK.
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
jobs:
  ios:
    runs-on: macos-latest
    env:
      # The same minimum iOS for the C parts (aws-lc) as for Rust, or the link fails.
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Core for iPhone and the simulator, with the Swift bindings
        run: apps/ios/scripts/build-core.sh
      - run: brew install xcodegen
      - name: iPhone app for the simulator
        working-directory: apps/ios
        run: |
          xcodegen
          xcodebuild -project Merel.xcodeproj -scheme Merel -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: merel-core-ios
          path: apps/ios/Generated
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Core for Android phones and the emulator, with the Kotlin bindings
        run: apps/android/scripts/build-core.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android app
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: merel-android-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

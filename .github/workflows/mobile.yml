name: Mobile
# Builds Merel's core (crates/mobile) for the iPhone and Android with the Swift and Kotlin
# bindings the apps call it through, and the iPhone app (apps/ios) for the simulator.
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
jobs:
  ios:
    runs-on: macos-latest
    env:
      # The same minimum iOS for the C parts (aws-lc) as for Rust, or the link fails.
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Core for iPhone and the simulator, with the Swift bindings
        run: apps/ios/scripts/build-core.sh
      - run: brew install xcodegen
      - name: iPhone app for the simulator
        working-directory: apps/ios
        run: |
          xcodegen
          xcodebuild -project Merel.xcodeproj -scheme Merel -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: merel-core-ios
          path: apps/ios/Generated
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Core for Android phones and the emulator
        run: cargo ndk -t arm64-v8a -t x86_64 -o jniLibs build -p merel-mobile --lib --release
      - name: Kotlin bindings
        run: |
          cargo build -p merel-mobile --lib
          cargo run -p merel-mobile --bin uniffi-bindgen -- generate --library target/debug/libmerel_mobile.so --language kotlin --out-dir bindings/kotlin
      - uses: actions/upload-artifact@v4
        with:
          name: merel-core-android
          path: |
            jniLibs
            bindings/kotlin

name: Release
# A tag vX.Y.Z builds the installers for macOS, Windows and Linux and publishes them as a GitHub
# release. Running the workflow by hand with "publish" on does the same for the version in
# Cargo.toml, creating the tag on the chosen commit. A pull request that changes the packaging
# builds them too, as workflow artifacts, so a broken installer shows up before the next release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "packaging/**", "apps/merel/**", "apps/merel-signal/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for the version in Cargo.toml
        type: boolean
        default: false
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # The Signal libraries compile their protocol buffers at build time.
      # coreutils: RingRTC's build scripts use grealpath.
      - run: brew install protobuf coreutils
      - uses: Swatinem/rust-cache@v2
        with:
          # The runner image is in the key: a cache from an older macOS links against its Xcode.
          key: macos-15
          workspaces: |
            .
            apps/merel-signal
      - run: cargo build --release --locked -p merel --target aarch64-apple-darwin
      - run: cargo build --release --locked -p merel --target x86_64-apple-darwin
      # Signal's own program, which Merel starts next to itself (AGPL, so a separate program).
      # RingRTC fetches WebRTC into OUTPUT_DIR, by default one folder in its checkout for every
      # target: from the cache, the arm build found the Intel library of the last build there.
      # A fresh folder per target makes it fetch the right one each time.
      - run: cargo build --release --locked --manifest-path apps/merel-signal/Cargo.toml --features calls-prebuilt --target aarch64-apple-darwin
        env:
          OUTPUT_DIR: ${{ runner.temp }}/webrtc-aarch64
      - run: cargo build --release --locked --manifest-path apps/merel-signal/Cargo.toml --features calls-prebuilt --target x86_64-apple-darwin
        env:
          OUTPUT_DIR: ${{ runner.temp }}/webrtc-x86_64
      - run: packaging/macos/bundle.sh
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p merel
      - name: Installer
        # PowerShell, not Git Bash: Bash would turn the /D switch into a path.
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches.Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\merel.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    # The oldest supported runner: an AppImage only runs on systems at least as new as where it was built.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfuse2 libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p merel
      - name: Debian package
        run: |
          cargo install cargo-deb --locked
          mkdir -p dist
          cargo deb -p merel --no-build --output dist/
      - name: AppImage
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/
          packaging/linux/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MEREL_SIGNING_KEY: ${{ secrets.MEREL_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag
        id: tag
        run: |
          tag="v$(packaging/version.sh)"
          # A pushed tag must match the version; a run by hand creates that tag.
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "$tag"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      # The app installs an update only when this signature checks out under the public key it
      # carries; without the secret the release is published unsigned and updates go through
      # the release page.
      - uses: dtolnay/rust-toolchain@stable
        if: env.MEREL_SIGNING_KEY != ''
      - name: Sign the checksums
        if: env.MEREL_SIGNING_KEY != ''
        run: cargo run --release --locked -p merel-sign -- sign dist/SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        # packaging/release-notes/<version>.md, when there is one, goes above GitHub's list of
        # pull requests: what is new, in Dutch, for the people who use Merel.
        run: |
          notes="packaging/release-notes/${TAG#v}.md"
          set --
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Merel ${TAG#v}" --generate-notes "$@"

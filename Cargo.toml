[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
# internal
mailcraft-model = { path = "crates/model" }
mailcraft-engine = { path = "crates/engine" }
mailcraft-ui-egui = { path = "crates/ui-egui" }
mailcraft-secrets = { path = "crates/secrets" }
mailcraft-mime = { path = "crates/mime" }
mailcraft-imap = { path = "crates/imap" }
mailcraft-smtp = { path = "crates/smtp" }
mailcraft-oauth = { path = "crates/oauth" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
zeroize = { version = "1", features = ["derive"] }
directories = "6"

# mail
# IMAP over rustls; certificates checked by the platform verifier (system trust store).
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
mail-parser = "0.11"
imap-proto = "0.16"
html2text = "0.17"
keyring = "4"
# OAuth 2.0 token exchange over HTTPS, same TLS stack as the mail protocols.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
open = "5"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
# SMTP over rustls with the platform verifier; aws-lc-rs matches the IMAP side so rustls has one provider.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls", "aws-lc-rs", "rustls-platform-verifier"] }

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
debug = 0

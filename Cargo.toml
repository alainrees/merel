[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
# The phone apps are Xcode and Gradle projects; their Rust core is crates/mobile.
# merel-signal is AGPL and has its own workspace; Merel runs it as a separate program.
exclude = ["apps/ios", "apps/android", "apps/merel-signal"]

[workspace.package]
version = "0.1.27"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# internal
merel-model = { path = "crates/model" }
merel-engine = { path = "crates/engine" }
merel-ui-egui = { path = "crates/ui-egui" }
merel-secrets = { path = "crates/secrets" }
merel-mime = { path = "crates/mime" }
merel-imap = { path = "crates/imap" }
merel-smtp = { path = "crates/smtp" }
merel-oauth = { path = "crates/oauth" }
merel-mailbox = { path = "crates/mailbox" }
merel-exchange = { path = "crates/exchange" }
merel-google = { path = "crates/google" }
merel-graph = { path = "crates/graph" }
merel-html = { path = "crates/html" }
merel-store = { path = "crates/store" }
merel-dav = { path = "crates/dav" }
merel-smime = { path = "crates/smime" }
merel-pgp = { path = "crates/pgp" }
merel-touch-bar = { path = "crates/touch-bar" }
merel-window-buttons = { path = "crates/window-buttons" }
merel-sign = { path = "crates/sign" }
merel-notify = { path = "crates/notify" }
merel-i18n = { path = "crates/i18n" }
merel-call = { path = "crates/call" }
merel-mobile = { path = "crates/mobile" }
merel-search = { path = "crates/search" }
merel-extract = { path = "crates/extract" }
merel-semantic = { path = "crates/semantic" }
merel-signal-link = { path = "crates/signal" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
zeroize = { version = "1", features = ["derive"] }
directories = "6"

# mail
# IMAP protocol only; Merel opens the TCP and TLS connection itself (rustls with the
# platform verifier, timeouts on every step) and hands it over.
imap = { version = "3.0.0-alpha.15", default-features = false }
mail-parser = "0.11"
imap-proto = "0.16"
html2text = "0.17"
# The HTML5 parser behind html2text, used directly to build the reading pane's layout tree.
html5ever = "0.40"
keyring = "4"
# OAuth 2.0 token exchange over HTTPS, same TLS stack as the mail protocols.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json"] }
# The computer's trusted root certificates, to check who issued an S/MIME certificate.
rustls-native-certs = "0.8"
# OpenPGP (rPGP, pure Rust); bzip2 left out, as no mail program compresses with it.
pgp = { version = "0.21", default-features = false }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
# The computer's own certificate check (Keychain on macOS), for IMAP like ureq and lettre do.
rustls-platform-verifier = "0.7"
# The offline cache is sealed with ChaCha20-Poly1305 from the same crypto library rustls uses.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
# S/MIME: PKCS#12 import, and the CMS structures of signed mail; the signing itself is aws-lc-rs.
p12-keystore = "0.4"
cms = { version = "=0.3.0-pre.1", features = ["std"] }
der = { version = "0.8", features = ["alloc", "std"] }
x509-cert = "0.3"
open = "5"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
# Exchange Web Services responses; a read-only tree without unsafe code.
roxmltree = "0.21"
# SMTP over rustls; aws-lc-rs matches the IMAP side so rustls has one provider. Which root
# certificates it trusts is chosen per platform in crates/smtp.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls", "aws-lc-rs"] }

# search: the local full-text index (stemming, typo tolerance, ranking); lz4 is pure Rust, no mmap
# since the index lives decrypted in memory only.
tantivy = { version = "0.27", default-features = false, features = ["lz4-compression", "stemmer"] }
# search: the text inside attachments. Pure Rust; both read untrusted files with limits on
# what a compressed stream may grow to.
lopdf = { version = "0.46", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# search on meaning: a small multilingual embedding model run on the CPU, pure Rust (no ONNX
# runtime, no Python); the model itself is downloaded only when the person switches it on.
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

# calendar: date arithmetic and the computer's time zone
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# the computer's time zone by its IANA name, to tell Exchange which midnight an all-day appointment means
iana-time-zone = "0.1"
# IANA time zone rules, to place a CalDAV time with a TZID on the clock.
chrono-tz = "0.10"

# ui
egui = "0.36"
# Translations: one Fluent file per language (crates/ui-egui/locales), and the language the computer is set to.
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
sys-locale = "0.3"
qrcode = { version = "0.14", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
# Image decoding for pictures embedded in mail (no SVG: no text rendering engine, no scripts).
egui_extras = { version = "0.36", default-features = false, features = ["image", "gif", "webp", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# The computer's own file dialog, to pick attachments (native on macOS and Windows, the desktop portal on Linux).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
debug = 0

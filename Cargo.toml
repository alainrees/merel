[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
# internal
mailcraft-model = { path = "crates/model" }
mailcraft-engine = { path = "crates/engine" }
mailcraft-ui-egui = { path = "crates/ui-egui" }
mailcraft-secrets = { path = "crates/secrets" }
mailcraft-mime = { path = "crates/mime" }
mailcraft-imap = { path = "crates/imap" }
mailcraft-smtp = { path = "crates/smtp" }
mailcraft-oauth = { path = "crates/oauth" }
mailcraft-mailbox = { path = "crates/mailbox" }
mailcraft-exchange = { path = "crates/exchange" }
mailcraft-google = { path = "crates/google" }
mailcraft-graph = { path = "crates/graph" }
mailcraft-html = { path = "crates/html" }
mailcraft-store = { path = "crates/store" }
mailcraft-dav = { path = "crates/dav" }
mailcraft-smime = { path = "crates/smime" }
mailcraft-pgp = { path = "crates/pgp" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
zeroize = { version = "1", features = ["derive"] }
directories = "6"

# mail
# IMAP over rustls; certificates checked by the platform verifier (system trust store).
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
mail-parser = "0.11"
imap-proto = "0.16"
html2text = "0.17"
# The HTML5 parser behind html2text, used directly to build the reading pane's layout tree.
html5ever = "0.40"
keyring = "4"
# OAuth 2.0 token exchange over HTTPS, same TLS stack as the mail protocols.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json"] }
# The computer's trusted root certificates, to check who issued an S/MIME certificate.
rustls-native-certs = "0.8"
# OpenPGP (rPGP, pure Rust); bzip2 left out, as no mail program compresses with it.
pgp = { version = "0.21", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
# The offline cache is sealed with ChaCha20-Poly1305 from the same crypto library rustls uses.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
# S/MIME: PKCS#12 import, and the CMS structures of signed mail; the signing itself is aws-lc-rs.
p12-keystore = "0.4"
cms = { version = "=0.3.0-pre.1", features = ["std"] }
der = { version = "0.8", features = ["alloc", "std"] }
x509-cert = "0.3"
open = "5"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
# Exchange Web Services responses; a read-only tree without unsafe code.
roxmltree = "0.21"
# SMTP over rustls with the platform verifier; aws-lc-rs matches the IMAP side so rustls has one provider.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls", "aws-lc-rs", "rustls-platform-verifier"] }

# calendar: date arithmetic and the computer's time zone
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# the computer's time zone by its IANA name, to tell Exchange which midnight an all-day appointment means
iana-time-zone = "0.1"
# IANA time zone rules, to place a CalDAV time with a TZID on the clock.
chrono-tz = "0.10"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
# Image decoding for pictures embedded in mail (no SVG: no text rendering engine, no scripts).
egui_extras = { version = "0.36", default-features = false, features = ["image", "gif", "webp", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# The computer's own file dialog, to pick attachments (native on macOS and Windows, the desktop portal on Linux).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
debug = 0

# The iPhone app's Xcode project, generated by XcodeGen (`brew install xcodegen`, then
# `xcodegen` in this folder). The project file itself is not kept in git.
name: Merel
options:
  bundleIdPrefix: nl.merel
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nl
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Your own Apple ID team comes from Config/Local.xcconfig (see the target); CI builds unsigned.
    CODE_SIGN_STYLE: Automatic
targets:
  Merel:
    type: application
    platform: iOS
    sources:
      - path: Merel
      # The Swift side of the core, written by scripts/build-core.sh.
      - path: Generated/Swift
        optional: true
    dependencies:
      - framework: Generated/MerelCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libresolv.tbd
    # The bundle identifier and Apple ID team: Config/Merel.xcconfig, and your own in
    # Config/Local.xcconfig (scripts/signing.sh), so `xcodegen` keeps them.
    configFiles:
      Debug: Config/Merel.xcconfig
      Release: Config/Merel.xcconfig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Merel/Info.plist
      properties:
        CFBundleDisplayName: Merel
        CFBundleDevelopmentRegion: nl
        CFBundleLocalizations: [nl, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Only encrypted connections, also for anything the system frameworks would load.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false

[package]
name = "merel-signal"
description = "Signal for Merel: links as a secondary device and passes messages to Merel as JSON lines."
version = "0.1.0"
edition = "2024"
# The Signal libraries are AGPL, so this helper is too. Merel runs it as a separate program and
# talks to it over stdin and stdout; Merel itself stays MIT OR Apache-2.0.
license = "AGPL-3.0-only"
publish = false

# Its own workspace: the Signal libraries stay out of Merel's build and lockfile.
[workspace]

[dependencies]
presage = { git = "https://github.com/whisperfish/presage", rev = "aeaedf99babebae2dbc6b86bca797807d4cd9fda" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "aeaedf99babebae2dbc6b86bca797807d4cd9fda", default-features = false }
# SQLCipher with its own OpenSSL, so the app needs nothing installed on the computer.
libsqlite3-sys = { version = "0.36.0", features = ["bundled-sqlcipher-vendored-openssl"] }
anyhow = "1.0"
base64 = "0.22"
futures = "0.3"
hex = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Only to list the chats in the store; presage keeps no list of them.
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "uuid", "runtime-tokio"] }
uuid = { version = "1.12", features = ["v4"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "process"] }

# Signal's own calling library, for calls in Merel. It plays and records sound itself.
ringrtc = { git = "https://github.com/signalapp/ringrtc", tag = "v2.73.0", features = ["native"], optional = true }

[features]
# The calls program merel-signal-calls, with RingRTC on a WebRTC built locally (see RingRTC's
# BUILDING.md)…
calls = ["dep:ringrtc"]
# …or on the WebRTC Signal builds for its own desktop app, fetched while building.
calls-prebuilt = ["calls", "ringrtc/prebuilt_webrtc"]

[[bin]]
name = "merel-signal"
path = "src/main.rs"

# Calls run in a program of their own: WebRTC brings BoringSSL, which cannot be linked next to
# the OpenSSL of the encrypted store (see src/wire.rs).
[[bin]]
name = "merel-signal-calls"
path = "src/bin/merel-signal-calls.rs"
required-features = ["calls"]

[patch.crates-io]
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

[profile.dev.package.libcrux-ml-kem]
# Unoptimised ML-KEM can overflow the stack decrypting a PQXDH prekey message.
opt-level = 3

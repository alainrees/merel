[package]
name = "merel"
description = "Merel desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
merel-engine = { workspace = true }
merel-secrets = { workspace = true }
merel-oauth = { workspace = true }
merel-ui-egui = { workspace = true }
merel-touch-bar = { workspace = true }
merel-window-buttons = { workspace = true }
merel-notify = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
log = { workspace = true }

# The macOS app menu with "Over Merel" and "Zoek naar updates…" (see src/app_menu.rs).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", default-features = false }

[lints]
workspace = true

# The .deb package for Debian and Ubuntu, made by cargo-deb in the release workflow.
[package.metadata.deb]
name = "merel"
maintainer = "Alain Rees"
copyright = "2026, the Merel authors"
section = "mail"
extended-description = "Mail, calendar, contacts and tasks for the desktop, with the way of working of Outlook."
depends = "$auto"
assets = [
    ["target/release/merel", "usr/bin/", "755"],
    ["../../packaging/linux/merel.desktop", "usr/share/applications/", "644"],
    ["../../packaging/icon-256.png", "usr/share/icons/hicolor/256x256/apps/merel.png", "644"],
]

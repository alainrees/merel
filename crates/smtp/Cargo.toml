[package]
name = "merel-smtp"
description = "Sending mail over SMTP with mandatory TLS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
merel-i18n = { workspace = true }
merel-model = { workspace = true }
merel-secrets = { workspace = true }
thiserror = { workspace = true }

# The computer's own certificate check, as for IMAP.
[target.'cfg(not(target_os = "android"))'.dependencies]
lettre = { workspace = true, features = ["rustls-platform-verifier"] }

# lettre cannot use the platform verifier on Android yet, so there it trusts Mozilla's root
# certificates (webpki-roots); certificate checks stay on.
[target.'cfg(target_os = "android")'.dependencies]
lettre = { workspace = true, features = ["webpki-roots"] }

[dev-dependencies]
merel-mime = { workspace = true }

[lints]
workspace = true

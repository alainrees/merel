[package]
name = "merel-window-buttons"
description = "Places the macOS window buttons in Merel's tall title bar."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
raw-window-handle = "0.6"
log = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSButton", "NSControl", "NSApplication"] }

# Reaching AppKit's views from winit's window handle, and teaching winit's application
# delegate to answer clicks on the Dock icon, need `unsafe`; every other crate but
# merel-touch-bar keeps the workspace's `unsafe_code = "forbid"`.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
